[package]
name = "cloudreve-api"
version = "0.5.4"
edition = "2024"
description = "A Rust library for interacting with Cloudreve API"
license = "MIT"
authors = ["larriti"]
repository = "https://github.com/larriti/cloudreve-api"
keywords = ["cloudreve", "api", "storage", "client"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.13", features = ["json", "multipart", "socks"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
url = "2.0"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
toml = "0.9"

[lib]
name = "cloudreve_api"
path = "src/lib.rs"
